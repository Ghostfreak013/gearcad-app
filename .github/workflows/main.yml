name: Build Free Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle and Cordova
        run: |
          sudo apt-get update && sudo apt-get install -y gradle unzip
          npm install -g cordova

      - name: Create Android App & Build APK
        run: |
          mkdir -p /tmp/web_assets
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z" -d /tmp/web_assets/; done
          cp *.html *.json *.png *.js /tmp/web_assets/ 2>/dev/null || true
          if [ ! -f /tmp/web_assets/index.html ]; then
            first_html=$(ls /tmp/web_assets/*.html 2>/dev/null | head -n 1)
            if [ -n "$first_html" ]; then
              cp "$first_html" /tmp/web_assets/index.html
            else
              echo "<h1>GearCAD Studio</h1>" > /tmp/web_assets/index.html
            fi
          fi
          cordova create gearcad_app com.workshop.gearcad GearCAD
          cd gearcad_app
          rm -rf www/*
          cp -r /tmp/web_assets/* www/
          cordova platform add android@12.0.1
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../GearCAD-Studio.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: GearCAD-Android-APK
          path: GearCAD-Studio.apk
